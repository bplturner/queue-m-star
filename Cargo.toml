[package]
name = "mstar_queue"
version = "0.1.0"
edition = "2021"

[dependencies]
notify = "5.1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "3.2", features = ["derive"] }
nix = "0.26.2"
shell-escape = "0.1.5"
md5 = "0.7.0"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
regex = "1.5"
tokio = { version = "1.39", features = ["full"] }
warp = "0.3"
futures = "0.3"
bytes = "1.0"
uuid = { version = "1.3.0", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
bcrypt = "0.15"
rand = "0.8"
libc = "0.2"
